[project]
name = "riseup-backend"
version = "0.0.0"
description = "Rise Up Roofing API & Developer Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    # FastAPI & core async runtime
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "pydantic==2.10.6",
    "orjson==3.10.15",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "psutil==6.1.1",
    # Database & migrations
    "sqlalchemy[asyncio]==2.0.38",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    # Redis & async background worker
    "redis[hiredis]==5.2.1",
    "arq==0.26.1",
    # S3 / MinIO object storage
    "aioboto3==15.5.0",
    "pillow==11.1.0",
    # Security & passwords
    "passlib[argon2,bcrypt]==1.7.4",
    # PDF generation engine & templates
    "playwright==1.51.0",
    "jinja2==3.1.5",
    "tzdata==2026.5",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "import-linter==2.15",
    "factory-boy==3.3.3",
    "syrupy==6.1.1",
    "pip-audit==2.10.1",
    "bandit==1.9.4",
    "respx>=0.22.0",
    "fakeredis>=2.27.0",
]

[tool.uv]
# This is an application, not an installable package.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend = "ruff-baseline.toml"
extend-exclude = ["alembic/versions", "scratch"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "S", "BLE", "ASYNC", "C90", "PLR",
    "SIM", "RET", "PT", "DTZ", "TRY", "T20",
]
# Ratchet: legacy violations are listed per-file in ruff-baseline.toml (generated by
# scripts/gen_ruff_baseline.py). New files get no ignores and must be clean.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50  # PLR0915; tuned toward the 60-line function bar

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header",
    "fastapi.Cookie", "fastapi.File", "fastapi.Form", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["app"]
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

# Strict where the code is small and foundational.
[[tool.mypy.overrides]]
module = ["app.core.*", "app.utils.*", "app.models.*"]
strict = true

# Legacy modules: documented debt, removed one by one in P3.
[[tool.mypy.overrides]]
module = ["app.api.*", "app.services.*", "app.middlewares.*", "app.schemas.*", "app.tasks.*", "app.main"]
ignore_errors = true

# Strict-mode baseline inside the "strict" packages (measured at the start of P1: 75 errors).
# Do not add modules here; fix and delete entries instead. New files are strict from day one.
[[tool.mypy.overrides]]
module = [
    "app.core.storage", "app.core.security", "app.core.redis",
    "app.core.permissions", "app.core.developer_auth",
]
ignore_errors = true

# SQLAlchemy models use `declarative_base()` (typed as Any). Migrating to `DeclarativeBase`
# is a P3 change; until then subclassing Any is tolerated here only.
[[tool.mypy.overrides]]
module = ["app.models.*"]
disallow_subclassing_any = false
disallow_any_generics = false

[tool.bandit]
exclude_dirs = ["tests", "scratch", "alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

