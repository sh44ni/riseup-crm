name: riseup-backend

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: riseup_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: riseup_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riseup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 In-Memory Cache & Task Queue ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: riseup_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO S3-Compatible Object Storage ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: riseup_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Auto-provision MinIO Buckets
  minio-init:
    image: minio/mc:latest
    container_name: riseup_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/riseup-media;
      mc mb --ignore-existing local/riseup-documents;
      mc anonymous set download local/riseup-media;
      echo 'Buckets provisioned successfully.';
      exit 0;
      "

  # ── FastAPI Application Service ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riseup_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/riseup_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── ARQ Background Worker (Async Review & Media Processing) ───────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riseup_arq_worker
    restart: unless-stopped
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r = redis.from_url(\"redis://redis:6379/0\"); r.ping()' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/riseup_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
