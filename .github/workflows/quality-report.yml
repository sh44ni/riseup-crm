name: Scheduled Quality Report

on:
  schedule:
    # Run every Monday morning at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ratchet-report:
    name: Generate Quality Ratchet Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Quality Ratchet Check
        id: ratchet
        run: |
          python scripts/quality_ratchet.py > ratchet_output.txt || true
          cat ratchet_output.txt

      - name: Upload Quality Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: weekly-quality-ratchet-report
          path: ratchet_output.txt
          retention-days: 90
