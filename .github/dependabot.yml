# Dependabot configuration — automatically opens PRs for dependency updates.
# Updates are grouped so there is one PR per ecosystem per week instead of one per package.
version: 2
updates:
  # Python backend dependencies (pyproject.toml + uv.lock; requirements.txt is generated from the
  # lock, so the plain "pip" ecosystem must not be used here).
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "backend"
    open-pull-requests-limit: 3
    groups:
      backend-minor-and-patch:
        update-types: ["minor", "patch"]

  # JavaScript workspaces (website + crm). The npm workspace root owns the lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "frontend"
    open-pull-requests-limit: 3
    groups:
      js-minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions version updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
